<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奶家族谱</title>
<style type="text/css">
html, body {
	height: 100%;
	margin: 0;
}
body {
	display: flex;
	flex-direction: column;
	background-color: #0a1418;
	background-image: radial-gradient(circle at 50% -20%, #1d3a44 0%, #0a1418 55%);
	color: #eaf1f3;
	font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", Arial, sans-serif;
	overflow: hidden;
}

/* ================= 上边栏 ================= */
.topbar {
	flex: none;
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 14px 30px;
	background-color: rgba(8, 18, 23, 0.72);
	border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
.brand {
	font-family: "Songti SC", "宋体", "SimSun", serif;
	font-size: 24px;
	letter-spacing: 6px;
	color: #f2f7f8;
}
.brand span {
	font-family: Arial, sans-serif;
	font-size: 11px;
	letter-spacing: 3px;
	color: rgba(234, 241, 243, 0.45);
	margin-left: 10px;
}
.nav a {
	display: inline-block;
	margin-left: 10px;
	padding: 9px 22px;
	border-radius: 999px;
	border: 1px solid rgba(255, 255, 255, 0.18);
	background-color: rgba(255, 255, 255, 0.10);
	color: #eaf1f3;
	font-size: 14px;
	text-decoration: none;
	transition: background-color 0.25s ease, border-color 0.25s ease;
}
.nav a:hover {
	background-color: rgba(255, 255, 255, 0.24);
	border-color: rgba(255, 255, 255, 0.4);
}
.nav a.primary {
	background-color: rgba(255, 255, 255, 0.66);
	border-color: rgba(255, 255, 255, 0.66);
	color: #16303a;
	font-weight: bold;
}
.nav a.primary:hover {
	background-color: rgba(255, 255, 255, 0.88);
}

/* ================= 主体：左图右文 ================= */
.main {
	flex: 1;
	display: flex;
	min-height: 0;
	padding: 28px 30px 30px 30px;
	box-sizing: border-box;
}

/* 左边栏：图片 */
.photo {
	flex: 0 0 42%;
	position: relative;
	overflow: hidden;
	border-radius: 18px;
	border: 1px solid rgba(255, 255, 255, 0.14);
	background-color: #0e1c22;
	min-width: 0;
}
.photo img {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;      /* 照片裁切铺满，不拉伸变形 */
	object-position: 50% 42%; /* 让眼睛保持在画面偏上的位置 */
}
.photo .tag {
	position: absolute;
	left: 18px;
	bottom: 16px;
	padding: 6px 14px;
	border-radius: 999px;
	background-color: rgba(255, 255, 255, 0.62);
	color: #16303a;
	font-size: 12px;
	letter-spacing: 2px;
	-webkit-backdrop-filter: blur(2px);
	backdrop-filter: blur(2px);
}

/* 右边栏：文字区 */
.text {
	flex: 1;
	min-width: 0;
	margin-left: 26px;
	padding: 30px 34px;
	box-sizing: border-box;
	overflow-y: auto;
	border-radius: 18px;
	border: 1px solid rgba(255, 255, 255, 0.10);
	background-color: rgba(255, 255, 255, 0.05);
}
.text h1 {
	margin: 0 0 6px 0;
	font-family: "Songti SC", "宋体", "SimSun", serif;
	font-size: 26px;
	font-weight: normal;
	letter-spacing: 4px;
	color: #ffffff;
}
.text .sub {
	margin: 0 0 24px 0;
	font-size: 12px;
	letter-spacing: 2px;
	color: rgba(234, 241, 243, 0.45);
}
.text h2 {
	margin: 26px 0 10px 0;
	font-family: "Songti SC", "宋体", "SimSun", serif;
	font-size: 17px;
	font-weight: normal;
	letter-spacing: 2px;
	color: #cfe2e7;
	padding-left: 12px;
	border-left: 3px solid rgba(255, 255, 255, 0.45);
}
.text p {
	margin: 0 0 14px 0;
	font-size: 14px;
	line-height: 2;
	color: rgba(234, 241, 243, 0.78);
	text-indent: 2em;
}

/* 窄窗口时上下排列 */
@media screen and (max-width: 820px) {
	body { overflow: auto; }
	.main { flex-direction: column; padding: 18px; }
	.photo { flex: none; height: 46vh; }
	.text { flex: none; margin: 18px 0 0 0; overflow: visible; }
	.nav a { margin: 6px 0 0 8px; padding: 7px 14px; font-size: 13px; }
}

/* ================= 族谱格子（3 列 x 2 行，一屏正好 6 个） ================= */
.nav a.current {
	background-color: rgba(255, 255, 255, 0.20);
	border-color: rgba(255, 255, 255, 0.45);
}
.grid {
	flex: 1;
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	grid-template-rows: repeat(2, 1fr);
	gap: 18px;
	padding: 24px 28px;
	box-sizing: border-box;
	min-height: 0;
}
.card {
	position: relative;
	display: flex;
	flex-direction: column;
	min-height: 0;
	border-radius: 16px;
	overflow: hidden;
	background-color: rgba(255, 255, 255, 0.06);
	border: 1px solid rgba(255, 255, 255, 0.12);
	color: #eaf1f3;
	text-decoration: none;
	transition: border-color 0.25s ease, transform 0.25s ease;
}
.card:hover {
	border-color: rgba(255, 255, 255, 0.42);
	transform: translateY(-3px);
}
.card .pic {
	flex: 1 1 auto;
	min-height: 0;
	overflow: hidden;
	background-color: #0e1c22;
}
.card .pic img {
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
	transition: transform 0.4s ease;
}
.card:hover .pic img {
	transform: scale(1.04);
}
.card .name {
	flex: none;
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 11px 16px;
	background-color: rgba(0, 0, 0, 0.28);
	font-family: "Songti SC", "宋体", "SimSun", serif;
	font-size: 15px;
	letter-spacing: 3px;
}
.card .name em {
	font-style: normal;
	font-family: Arial, sans-serif;
	font-size: 10px;
	letter-spacing: 2px;
	color: rgba(234, 241, 243, 0.45);
}
/* 还没有图片的格子：虚线占位 */
.card.empty .pic {
	display: flex;
	align-items: center;
	justify-content: center;
	background-color: rgba(255, 255, 255, 0.03);
}
.card.empty .pic span {
	font-size: 12px;
	letter-spacing: 2px;
	color: rgba(234, 241, 243, 0.35);
}

/* 透明背景的角色图：完整显示，不裁切 */
.card.cutout .pic img {
	object-fit: contain;
}

/* 窄屏：改成两列，页面可滚动 */
@media screen and (max-width: 900px) {
	body { overflow: auto; }
	.grid {
		grid-template-columns: repeat(2, 1fr);
		grid-template-rows: none;
		grid-auto-rows: 190px;
		padding: 18px;
		gap: 14px;
	}
	.card .name { padding: 8px 12px; font-size: 14px; }
}

/* 导航里的音频开关（原「关于奶眼」占位按钮） */
.nav a.audio-btn.playing {
	background-color: rgba(255, 255, 255, 0.30);
	border-color: rgba(255, 255, 255, 0.60);
}
</style>
</head>

<body>

<!-- ============ 上边栏 ============ -->
<header class="topbar">
	<div class="brand">奶家族谱<span>FAMILY</span></div>
	<nav class="nav">
		<a class="primary" href="Choose.html">继续观察</a>
		<a href="index.html">返回首页</a>
		<a class="current" href="family.html">奶家族谱</a>
		<a href="#" class="audio-btn" id="audioBtn" onclick="return toggleAudio();">播放音频</a>
	</nav>
</header>

<!-- ============ 3 x 2 格子 ============ -->
<div class="grid">
	<a class="card cutout" href="long.html">
		<div class="pic">
			<img src="image/naiyan-long.png" alt="奶龙">
		</div>
		<div class="name">奶龙<em>DRAGON</em></div>
	</a>
	<a class="card cutout" href="frog.html">
		<div class="pic">
			<img src="image/naiyan-frog.png" alt="奶蛙">
		</div>
		<div class="name">奶蛙<em>FROG</em></div>
	</a>
	<a class="card cutout" href="egg.html">
		<div class="pic">
			<img src="image/naiyan-egg.png" alt="奶蛋">
		</div>
		<div class="name">奶蛋<em>EGG</em></div>
	</a>
	<a class="card cutout" href="baby.html">
		<div class="pic">
			<img src="image/naiyan-baby.png" alt="小奶蛙">
		</div>
		<div class="name">小奶蛙<em>BABY</em></div>
	</a>
	<a class="card cutout" href="mouse.html">
		<div class="pic">
			<img src="image/naiyan-mouse.png" alt="奶鼠">
		</div>
		<div class="name">奶鼠<em>MOUSE</em></div>
	</a>
	<a class="card cutout" href="milk.html">
		<div class="pic">
			<img src="image/naiyan-milk.png" alt="奶粉">
		</div>
		<div class="name">奶粉<em>MILK</em></div>
	</a>
</div>


<!-- ============ 背景音频 ============ -->
<audio id="bgm" src="audio/bgm.mp3" loop preload="auto"></audio>
<script type="text/javascript">
(function () {
	var audio = document.getElementById('bgm');
	var btn = document.getElementById('audioBtn');
	var KEY_ON = 'bgm', KEY_TIME = 'bgmTime';

	function get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
	function set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

	function syncLabel() {
		btn.textContent = audio.paused ? '播放音频' : '暂停音频';
		btn.className = audio.paused ? 'audio-btn' : 'audio-btn playing';
	}

	function saveTime() {
		if (audio.currentTime > 0) { set(KEY_TIME, audio.currentTime.toFixed(2)); }
	}

	// ---- 断点续播：接着上次的位置放，而不是从头 ----
	var saved = parseFloat(get(KEY_TIME) || '0');
	if (!isFinite(saved) || saved < 0) { saved = 0; }
	function seekToSaved() {
		try {
			var dur = audio.duration;
			if (saved > 0 && (isNaN(dur) || saved < dur - 0.2)) { audio.currentTime = saved; }
		} catch (e) {}
	}
	if (audio.readyState >= 1) { seekToSaved(); }
	else { audio.addEventListener('loadedmetadata', seekToSaved); }

	// 播放中每秒记一次位置；离开页面时再记一次
	var lastSave = 0;
	audio.addEventListener('timeupdate', function () {
		var now = Date.now();
		if (now - lastSave > 1000) { lastSave = now; saveTime(); }
	});
	window.addEventListener('pagehide', saveTime);
	window.addEventListener('beforeunload', saveTime);

	window.toggleAudio = function () {
		if (audio.paused) {
			set(KEY_ON, 'on');
			var p = audio.play();
			if (p && p.catch) { p.catch(function () { syncLabel(); }); }
		} else {
			set(KEY_ON, 'off');
			saveTime();
			audio.pause();
		}
		return false;   // 阻止 <a href="#"> 跳回页首
	};

	audio.addEventListener('play', function () { syncLabel(); set(KEY_ON, 'on'); });
	audio.addEventListener('pause', function () { syncLabel(); });

	// 进入页面先试着自动播放；被浏览器拦下就保持「播放音频」，等用户点一下
	if (get(KEY_ON) !== 'off') {
		try {
			var p2 = audio.play();
			if (p2 && p2.catch) { p2.catch(function () { syncLabel(); }); }
		} catch (e) {}
	}

	syncLabel();
})();
</script>
</body>
</html>
